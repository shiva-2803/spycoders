<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" method="post">

        <h1>All Forms Types Demo</h1>
        <label for="text">Text:</label>
        <input type="text" id="text" name="text" placeholder="Your name" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Secret" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="your email" required><br><br>
        <label for="url">URL:</label>
        <input type="url" id="url" name="url" placeholder="https://example.com"><br><br>
        <label for="tel">Telephone:</label>
        <input type="tel" id="tel" name="tel" placeholder="+91 9876543210"><br><br>
        <label for="search">Search:</label>
        <input type="search" id="search" name="search" placeholder="What are you looking for?" required><br><br>
        <label for="number">Number:</label>
        <input type="number" id="number" name="number" min="0" max="100" required><br><br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required><br><br>
        <label for="range">Range:</label>
        <input type="range" id="range" name="range"><br><br>
        <label for="time">Time:</label>
        <input type="time" id="time" name="time"><br><br>
        <label for="week">Week:</label>
        <input type="week" id="week" name="week"><br><br>
        <label for="month">Month:</label>
        <input type="month" id="month" name="month"><br><br>
        <label for="file">File:</label>
        <input type="file" id="file" name="file" placeholder="Choose file" accept=".pdf"><br><br>
        <label for="color">Color:</label>
        <input type="color" id="color" name="color" value="#ffffff"><br><br>
        <input type="checkbox" id="checkbox1" name="checkbox1" value="I agree to terms">I agree to the terms and
        conditions<br><br>
        <input type="checkbox" id="checkbox2" name="checkbox2" value="Subscribe to newsletter">Subscribe
        tonewsletter<br><br>
        <label for="gender">Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">Male<br>
        <input type="radio" id="female" name="gender" value="female">Female<br>
        <input type="radio" id="other" name="gender" value="other">Other<br><br>
        <label for="country">Country(Single select):</label>
        <select id="country" name="country">
            <option value="">--choose--</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="Canada">Canada</option>
        </select><br><br>
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" cols="50" placeholder="Write something..."></textarea><br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset form">
        <div>
            <form action="" method="post" style="display: grid; grid-template-columns: 200px 100px 300px;">
                <label for="text">Text</label>
                <span>:</span>
                <input type="text" id="text" name="text" placeholder="Your name" required><br><br>
                <label for="password">Password</label>
                <span>:</span>
                <input type="password" id="password" name="password" placeholder="Secret" required><br><br>
                <label for="email">Email</label>
                <span>:</span>
                <input type="email" id="email" name="email" placeholder="your email" required><br><br>
            </form>
        </div>
    </form>

</body>

</html>
