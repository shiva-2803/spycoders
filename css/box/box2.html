<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            background: rgb(231, 213, 213);
            display: flex;
            justify-content: center;
            align-items: center;
            height:100vh;
        }

        .container {
            display: flex;
            gap: 40px;
        }

        .box {
            width: 280px;
            height: 450px;
            background: #fff;
            border-radius: 0%;
            box-shadow: 0 0 10px rgba(240, 229, 33, 0.4);
            padding: 20px;
            text-align: center;
        }

        .image img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 5px solid #f45a27;
            margin-top: 15px;
            object-fit: cover;
        }

        .box1 h1 {
            font-size: 28px;
            margin-top: 20px;
        }

        .box1 p {
            font-size: 18px;
            color: #555;
            margin-top: 5px;
        }

        .image2 img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #f45a27;
            margin-top: 25px;
        }

        .company p,
        .box1 p {
            font-size: 20px;
            margin-top: 10px;
        }

        .mini {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
        }

        .mini1 {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 100px;

        }

        .info {
            text-align: left;
            margin-top: 20px;
        }

        .label {
            display: inline-block;
            font-weight: bold;
            width: 80px;
        }

        .colon {
            display: inline-block;
            width: 10px;
            text-align: center;
        }

        .barcode {
            width: 150px;
            justify-content: center;
            margin-top: auto;
            margin-left: 50px;

        }
    </style>

</head>

<body>
    <div class="container">

        <section class="box">
            <div class="image">
                <img src="https://i.pravatar.cc/150?img=12" alt="Image">
            </div>
            <div class="box1">
                <h1>JOHN SMITH</h1>
                <p>Creative Manager</p>
            </div>
            <section class="mini">
                <div class="image2">
                    <img src="https://imgs.search.brave.com/EMireCY9rimY9iGPYij0xtaMhIZB2qKd7VmxHHiube0/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93YWxs/cGFwZXJhY2Nlc3Mu/Y29tL2Z1bGwvNjU3/ODE1My5qcGc"
                        alt="Logo">
                </div>
                <div class="company">
                    <h2>TATA</h2>
                    <p>Leadership with Trust</p>
                </div>
            </section>
        </section>
        <section class="box">
            <section class="mini1">
                <div class="image2">
                    <img src="https://imgs.search.brave.com/EMireCY9rimY9iGPYij0xtaMhIZB2qKd7VmxHHiube0/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93YWxs/cGFwZXJhY2Nlc3Mu/Y29tL2Z1bGwvNjU3/ODE1My5qcGc"
                        alt="Image">
                </div>
                <div class="box2">
                    <h1>TATA</h1>
                    <p>Leadership with Trust</p>
                </div>
            </section>
            <div class="info">
                <p><span class="label">ID NO</span><span class="colon">:</span> 098276656</p>
                <p><span class="label">Blood</span><span class="colon">:</span> A-</p>
                <p><span class="label">Phone</span><span class="colon">:</span> 000-123-4567</p>
                <p><span class="label">Email</span><span class="colon">:</span> john.smith@example.com</p>
            </div>
            <img class="barcode"
                src="https://imgs.search.brave.com/iu2KHKSDCFHtC5l0V4G4hqFHjSnQq7PQmy_46Xh1i8A/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzLzlhLzJk/L2ZlLzlhMmRmZTkz/ODQ0YTFjNTk3NzY1/MTU2MThlYmE2Mjgx/LmpwZw"
                alt="Barcode">

        </section>
    </div>
</body>

</html>
