<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDENTIFICATION CARD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="id-card">
        <div class="title">IDENTIFICATION CARD</div>
        <div class="details">
            <div class="photo">
                <img src="https://i.pravatar.cc/150?img=12" alt="ID Card Image">
            </div>
            <div class="info">
                <p>Name:<strong> John Doe</strong></p>
                <p>Title: <strong>Director</strong></p>
                <p>ID NO: <strong>12345</strong></p>
                <p>Issued: <strong>01/01/2020</strong></p>
                <p>Expires: <strong>31/12/2020</strong></p>
                <h1>COMPANY</h1>
            </div>
        </div>
    </div>
</body>

</html>
