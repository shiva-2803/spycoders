<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <form action="" method="post">
        <fieldset>
            <legend></legend>
            <h1 align="center">Registration Form</h1>
            <label for="name">First Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your First Name"><br><br>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="Enter your Last Name"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your Email"><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>
            <label>Gender:</label>
            <input type="radio" name="gender" value="male" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" value="female" id="female">
            <label for="female">Female</label>
            <input type="radio" name="gender" value="other" id="other">
            <label for="other">Other</label><br><br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="100"><br><br>
            <label for="preferance">Preference:</label>
            <input type="checkbox" name="preferance" value="Acrlic Painting" id="acrylic">
            <label for="acrylic">Acrylic Painting</label>
            <input type="checkbox" name="preferance" value="Oil Painting" id="oil">
            <label for="oil">Oil Painting</label>
            <input type="checkbox" name="preferance" value="Watercolor Painting" id="watercolor">
            <label for="watercolor">Watercolor Painting</label><br><br>
            <label for="occupation">Occupation:</label>
            <select name="occupation" id="occupation">
                <option value="">Select your Occupation</option>
                <option value="Student">Student</option>
                <option value="Engineer">Engineer</option>
                <option value="Doctor">Doctor</option>
                <option value="Artist">Artist</option>
            </select><br><br>
            <label for="Bio">Bio:</label><br>
            <textarea name="Bio" id="Bio" rows="4" cols="50" placeholder="Tell us about yourself..."></textarea><br><br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
    </form>
</head>

<body>

</body>

</html>
