<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HTML froms -  ALl Input Types & attributes</h1>

    <form action="#" autocomplete="off" method="post">
       
        <fieldset>
            <legend>Text Based Input Elements</legend>
             <!-- <label for="fullname">Full Name:</label> -->
            <input type="text" id="fullname" name="fullname" placeholder="Enter Your Name" required minlength="3" maxlength="10" autofocus  value="Raghavendra"><br><br>
            <!--
            type="email"
            validates email formate automatically


            
            -->

            <input type="email" placeholder="Enter email" name="email" autocomplete="on">
            <!--
            type="password"
            hides the input value

            -->
            <input type="password" name="password" placeholder="Password" >

            <input type="tel" name="phone" placeholder="Phone Number" pattern="[0-9]{10}">

            <input type="url" name="website" placeholder="Enter your website URL">
            <input type="search" >
    </fieldset>

    <fieldset>
        <legend>Number & Date Inputs</legend>
        <input type="number" name="quantity" min="1" max="10" step="2" >

        <input type="date" name="bday" min="2000-01-01" max="2026-12-31">
        <input type="datetime-local" name="appointment" min="2024-01-01T00:00" max="2024-12-31T23:59">
        <input type="month" name="bdaymonth" min="2020-01" max="2025-12">
        <input type="week" name="bdayweek" min="2020-W01" max="2025-W52">
        <input type="time" name="bdaytime" min="09:00" max="18:00">

    </fieldset> 

    <fieldset>
    <legend>Selection  Input Elements</legend>

    <label>Gender:</label>
    <input type="radio" name="gender" value="male" id="male" checked> 
    <label for="male">Male</label>
    <input type="radio" name="gender" value="female"> female
    <input type="radio" name="gender" value="other"> other


    <label for="">Skills</label>
    <input type="checkbox" name="skills" value="html" checked readonly> HTML
    <input type="checkbox" name="skills" value="css"> CSS
    <input type="checkbox" name="skills" value="js"> JavaScript


    <select name="" id="">
        <option value="">---Select---</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="js">JavaScript</option>
    </select>

    <input type="file" name="resume" accept=".pdf, .doc, .docx" multiple>
    <input type="color" name="favcolor" value="#ff0000" >
    <input type="range" name="points" min="0" max="10" step="2" >
        </fieldset>

<textarea name="bio" id="" placeholder="Enter your bio"></textarea>
        <button hidden>Submit</button>
        <button>Submit</button>
        <input type="button" value="Click Me">
        <input type="reset" value="Reset">
        <input type="submit" name="" id="" value="Submit">

    </form>
</body>
</html>
