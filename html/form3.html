<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <form action="https://script.google.com/macros/s/AKfycbzk131kY2xDljGK2g8IjeBGBaV1A7TPVrOjbIy-FxUITNeKUCvD89xDPa40pE7k0fqPGQ/exec" method="post">
        <fieldset>
            <legend></legend>
            <h1 >All Forms Types Demo</h1>
            <label for="Text">Text:</label>
            <input type="text" id="Text" name="Text" placeholder="Your name"><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Secret"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="you@example.com"><br><br>
            <label for="URL">URL:</label>
            <input type="url" id="URL" name="URL" placeholder="https://example.com"><br><br>
            <label for="number">Telephone:</label>
            <input type="tel" id="number" name="number" placeholder="+91 9876543210"><br><br>
            <label for="'Search">Search:</label>
            <input type="search" id="Search" name="Search" placeholder="Search Terms"><br><br>
            <label for="number">Number:</label>
            <input type="number" id="number" name="number"><br><br>
            <label for="range">Range:</label>
            <input type="range" id="range" name="range" min="0" max="100"><br><br>
            <label for="date">Date:</label>
            <input type="date" id="date" name="date">
            <lable type="time">Time:</label>
            <input type="time" id="time" name="time">
            <lable for="week">Week:</label>
            <input type="week" id="week" name="week">
            <label for="month">Month:</label>
            <input type="month" id="month" name="month"><br><br>
            <label for="file">File:</label>
            <input type="file" id="file" name="file" placeholder="Choose a file"><br><br>
            <label for="color">Color:</label>
            <input type="color" id="color" name="color" value="#ffffff"><br><br>
            <input type="checkbox" id="checkbox" name="checkbox" value="I agree to terms">
            <label for="checkbox">I agree to the terms and conditions</label><br><br>
            <input type="checkbox" id="checkbox" name="checkbox" value="Subscribe to newsletter">
            <label for="checkbox">Subscribe to newsletter</label><br><br>
            <label for="gender">Gender</label><br><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br><br>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label><br><br>
            <label for="Country">Country(Single select):</label>
            <select id="Country" name="Country" placeholder="--choose--">
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="Canada">Canada</option>
            </select><br><br>
            <label for="message">Message:</label><br><br>
            <textarea id="message" name="message" rows="4" cols="50" placeholder="Write something..."></textarea><br><br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">  
        </fieldset>
    </form>
</head>
<body>

</body>
</html>
