<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="logo">
        <span class="home">⌂</span>
        <span>MEAL FINDER</span>
    </div>
    <div class="menu">☰</div>
</header>
<section class="hero">
    <div class="search">
        <input type="text" placeholder="Search recipes here ...">
        <button class="but">⌕</button>
    </div>
    <h1>What are your favorite cuisines?</h1>
    <p>PERSONALIZE YOUR EXPERIENCE</p>
</section>
<section class="cats">
    <div class="cat-title">
        <h2>CATEGORIES</h2>
        <div class="under-line"></div>
    </div>
    <div class="cat-grid">
        <div class="catogory">
            <img src="https://www.themealdb.com/images/category/beef.png" alt="img">
            <span class="cato-name">BEEF</span> 
        </div>
         <div class="catogory">
            <img src="https://www.themealdb.com/images/category/chicken.png" alt="img">
            <span class="cato-name">CHICKEN</span>
        </div>
        <div class="catogory">
            <img src="https://www.themealdb.com/images/category/dessert.png" alt="img">
            <span class="cato-name">DESSERT</span>
    </div>
      <div class="catogory">
            <img src="https://www.themealdb.com/images/category/lamb.png" alt="img">
            <span class="cato-name">LAMB</span>
    </div>
    <div class="catogory">
            <img src="https://www.themealdb.com/images/category/miscellaneous.png" alt="img">
            <span class="cato-name">MISCELLANEOUS</span>
    </div>
    <div class="catogory">
            <img src="https://www.themealdb.com/images/category/pasta.png" alt="img">
            <span class="cato-name">PASTA</span>
    </div>
     <div class="catogory">
            <img src="https://www.themealdb.com/images/category/pork.png" alt="img">
            <span class="cato-name">PORK</span>
    </div>
    <div class="catogory">
            <img src="https://www.themealdb.com/images/category/seafood.png" alt="img">
            <span class="cato-name">SEAFOOD</span>
    </div>
    <div class="catogory">
            <img src="https://www.themealdb.com/images/category/side.png" alt="img">
            <span class="cato-name">SIDE</span>
    </div>
    <div class="catogory">
            <img src="https://www.themealdb.com/images/category/starter.png" alt="img">
            <span class="cato-name">STARTER</span>
    </div>
    <div class="catogory">
            <img src="https://www.themealdb.com/images/category/vegan.png" alt="img">
            <span class="cato-name">VEGAN</span>
    </div>
    <div class="catogory">
            <img src="https://www.themealdb.com/images/category/vegetarian.png" alt="img">
            <span class="cato-name">VEGETARIAN</span>
    </div>
    <div class="catogory">
            <img src="https://www.themealdb.com/images/category/breakfast.png" alt="img">
            <span class="cato-name">BREAKFAST</span>
    </div>
     <div class="catogory">
            <img src="https://www.themealdb.com/images/category/goat.png" alt="img">
            <span class="cato-name">GOAT</span>
    </div>
</section>

</body>

</html>
